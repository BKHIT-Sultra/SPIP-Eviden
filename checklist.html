<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checklist — SPIP Eviden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>

  <script>
    AUTH.requireLogin();
    LAYOUT.render('checklist');
  </script>

  <script>
    const params = new URLSearchParams(location.search);
    let kodeKK = params.get('kk') || '';
    let unit = params.get('unit');
    let periode = params.get('periode');

    let allData = [];

    async function init() {
      console.log('🚀 INIT checklist');
      
      const user = AUTH.getUser();
      console.log('👤 User:', user);
      
      // Unit: dari URL → user → fallback
      if (!unit && user && user.kode_unit) {
        unit = user.kode_unit;
      }
      console.log('📦 Unit:', unit);
      
      // Kalau user tidak punya kode_unit, pakai unit pertama
      if (!unit) {
        try {
          const units = await API.getUnits();
          const aktif = units.filter(u => u.aktif === true || String(u.aktif).toUpperCase() === 'TRUE');
          unit = aktif[0]?.kode_unit || '';
          console.log('📦 Unit fallback dari API:', unit);
        } catch (e) {
          console.error('Gagal ambil units:', e);
        }
      }

      // Periode: dari URL → periode aktif → fallback
      if (!periode) {
        try {
          const periodes = await API.getPeriodes();
          console.log('📅 Periodes:', periodes);
          
          // Prioritas: status='aktif'
          let aktif = periodes.find(p => {
            const s = String(p.status || '').toLowerCase().trim();
            return s === 'aktif';
          });
          
          // Kalau tidak ada, ambil tahun terbaru
          if (!aktif) {
            const sorted = periodes
              .map(p => ({ ...p, _t: parseInt(String(p.periode).match(/\d{4}/)?.[0] || 0) }))
              .sort((a, b) => b._t - a._t);
            aktif = sorted[0];
          }
          
          periode = aktif ? String(aktif.periode) : '';
          console.log('📅 Periode dipilih:', periode);
        } catch (e) {
          console.error('Gagal ambil periodes:', e);
        }
      }

      if (!unit || !periode) {
        LAYOUT.content().innerHTML = APP.errorBox(
          `Unit atau periode tidak ditemukan.\nUnit: ${unit || '-'} · Periode: ${periode || '-'}`
        );
        return;
      }

      loadChecklist();
    }

    async function loadChecklist() {
      const el = LAYOUT.content();
      el.innerHTML = APP.loadingBox('Memuat checklist...');

      console.log(`📡 API.getChecklist("${unit}", "${periode}", "${kodeKK}")`);

      try {
        allData = await API.getChecklist(unit, periode, kodeKK);
        console.log('✅ Data diterima:', allData.length, 'item');
        
        if (allData.length > 0) {
          console.log('📋 Contoh item pertama:', allData[0]);
        } else {
          console.warn('⚠️ Data kosong. Cek: apakah Trans_Checklist sudah di-generate?');
          // Debug: coba cek tanpa filter
          debugEmptyResult();
        }
        
        render();
      } catch (err) {
        console.error('❌ Error:', err);
        el.innerHTML = APP.errorBox(err.message);
      }
    }

    /**
     * Debug kalau data kosong — coba cek beberapa kombinasi
     */
    async function debugEmptyResult() {
      try {
        console.log('🔍 Debug: cek data tanpa filter...');
        
        // Coba tanpa kode_kk
        const withoutKK = await API.getChecklist(unit, periode, '');
        console.log(`   → tanpa kk: ${withoutKK.length} item`);
        
        // Coba periode lain
        const periodes = await API.getPeriodes();
        for (const p of periodes) {
          try {
            const result = await API.getChecklist(unit, String(p.periode), '');
            console.log(`   → unit=${unit}, periode=${p.periode}: ${result.length} item`);
          } catch (e) {
            console.log(`   → unit=${unit}, periode=${p.periode}: error`);
          }
        }
      } catch (e) {
        console.error('Debug gagal:', e);
      }
    }

    function render() {
      const el = LAYOUT.content();

      LAYOUT.setTitle(
        kodeKK ? `KK ${kodeKK}` : 'Semua Checklist',
        `${allData.length} parameter · ${unit} · ${periode}`
      );

      if (allData.length === 0) {
        el.innerHTML = `
          <div class="card p-12 text-center">
            <div class="text-5xl mb-4">📭</div>
            <div class="text-lg font-semibold text-slate-800 mb-2">Tidak ada data checklist</div>
            <div class="text-sm text-slate-500 mb-4">
              Filter: <b>${APP.esc(unit)}</b> · Periode: <b>${APP.esc(periode)}</b>${kodeKK ? ` · KK: <b>${APP.esc(kodeKK)}</b>` : ''}
            </div>
            <div class="text-xs text-slate-400 max-w-md mx-auto leading-relaxed">
              Kemungkinan penyebab:<br>
              1. Sheet <b>Trans_Checklist</b> belum di-generate<br>
              2. Unit / periode tidak cocok dengan data di sheet<br>
              3. Backend belum di-deploy ulang<br>
              <br>
              Buka <b>Console (F12)</b> untuk lihat detail debug.
            </div>
            <button onclick="loadChecklist()" class="btn btn-primary mt-4 text-sm">
              🔄 Coba Lagi
            </button>
          </div>
        `;
        return;
      }

      // Header KK
      let headerHtml = '';
      if (kodeKK) {
        const total = allData.length;
        const selesai = allData.filter(d => d.trans.status === 'Selesai').length;
        const progress = total > 0 ? Math.round((selesai / total) * 100) : 0;

        headerHtml = `
          <div class="card p-6 mb-6 border-l-4 border-blue-600 animate-fade-in">
            <div class="flex flex-wrap items-start justify-between gap-4">
              <div>
                <span class="badge badge-proses mb-2">KK ${kodeKK}</span>
                <h1 class="text-xl font-bold text-slate-800">${APP.esc(allData[0].subunsur)}</h1>
                <p class="text-sm text-slate-500 mt-1">Unit: <span class="font-medium text-slate-700">${APP.esc(unit)}</span> · Periode: <span class="font-medium text-slate-700">${APP.esc(periode)}</span></p>
              </div>
              <div class="text-right">
                <div class="text-4xl font-bold text-blue-700">${progress}%</div>
                <div class="text-xs text-slate-500 mt-1">${selesai} dari ${total} selesai</div>
              </div>
            </div>
          </div>
        `;
      }

      // Filter
      const filterHtml = `
        <div class="card p-4 mb-6 animate-fade-in">
          <div class="flex flex-wrap gap-3 items-center">
            <div class="flex-1 min-w-[200px] relative">
              <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              <input type="text" id="searchParam" placeholder="Cari parameter..." class="input pl-10"/>
            </div>
            <select id="filterStatus" class="input max-w-[180px]">
              <option value="">Semua Status</option>
              <option>Belum</option><option>Proses</option><option>Upload</option>
              <option>Verifikasi</option><option>Selesai</option><option>Revisi</option>
            </select>
            <select id="filterGrade" class="input max-w-[160px]">
              <option value="">Semua Grade</option>
              <option>A</option><option>B</option><option>C</option><option>D</option><option>E</option>
            </select>
          </div>
        </div>
      `;

      // Group per KK
      const groups = {};
      allData.forEach(d => {
        if (!groups[d.kode_kk]) {
          groups[d.kode_kk] = { kode_kk: d.kode_kk, subunsur: d.subunsur, items: [] };
        }
        groups[d.kode_kk].items.push(d);
      });

      const groupsHtml = Object.values(groups).map(g => renderGroup(g)).join('');

      el.innerHTML = headerHtml + filterHtml + `<div class="space-y-4">${groupsHtml}</div>`;

      // Events
      document.getElementById('searchParam').addEventListener('input', filter);
      document.getElementById('filterStatus').addEventListener('change', filter);
      document.getElementById('filterGrade').addEventListener('change', filter);
    }

    function renderGroup(g) {
      const total = g.items.length;
      const selesai = g.items.filter(i => i.trans.status === 'Selesai').length;

      return `
        <div class="card overflow-hidden animate-fade-in">
          <div class="px-5 py-4 bg-gradient-to-r from-blue-50 to-white border-b border-slate-100 flex items-center justify-between">
            <h2 class="font-bold text-slate-800 flex items-center gap-2">
              <span class="px-2 py-1 rounded-lg bg-blue-100 text-blue-700 text-xs font-mono font-bold">${g.kode_kk}</span>
              ${APP.esc(g.subunsur)}
            </h2>
            <span class="badge badge-proses">${selesai}/${total} selesai</span>
          </div>
          <div class="divide-y divide-slate-100">
            ${g.items.map(i => renderItem(i)).join('')}
          </div>
        </div>
      `;
    }

    function renderItem(item) {
      const t = item.trans;
      const ev = item.eviden || [];

      const sumberBadges = [];
      if (item.sumber.spip) sumberBadges.push('<span class="badge bg-emerald-100 text-emerald-700">SPIP</span>');
      if (item.sumber.mri) sumberBadges.push('<span class="badge badge-proses">MRI</span>');
      if (item.sumber.iepk) sumberBadges.push('<span class="badge bg-violet-100 text-violet-700">IEPK</span>');

      const gradesHtml = item.grades.map(g => `
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100 mb-2">
          <div class="flex items-center gap-2 mb-3">
            <span class="${APP.gradeClass(g.grade)}">Grade ${g.grade}</span>
            <span class="text-xs text-slate-500">Cara: ${APP.esc(g.cara_pengujian)}</span>
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <div class="text-xs font-semibold text-slate-500 uppercase mb-1.5">Kriteria</div>
              <div class="text-sm text-slate-700 leading-relaxed">${APP.esc(g.kriteria)}</div>
            </div>
            <div>
              <div class="text-xs font-semibold text-slate-500 uppercase mb-1.5">Penjelasan</div>
              <div class="text-sm text-slate-700 leading-relaxed">${formatPenjelasan(g.penjelasan)}</div>
            </div>
          </div>
        </div>
      `).join('');

      const evidenHtml = ev.length > 0
        ? ev.map(e => renderEviden(e)).join('')
        : '<div class="text-xs text-slate-400 italic py-3 text-center">Belum ada dokumen pendukung</div>';

      return `
        <details class="group" data-id="${item.id_trans}">
          <summary class="p-4 hover:bg-slate-50 flex items-start gap-3 transition">
            <div class="pt-0.5 shrink-0">
              <div class="w-6 h-6 rounded-full flex items-center justify-center ${
                t.status === 'Selesai' ? 'bg-emerald-500' :
                t.status === 'Upload'  ? 'bg-amber-500' :
                t.status === 'Belum'   ? 'bg-slate-300' : 'bg-blue-500'
              }">
                ${t.status === 'Selesai' ? `
                  <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                  </svg>` : ''}
              </div>
            </div>

            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
                <span class="text-xs font-mono bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">Param ${item.no_parameter}</span>
                ${t.grade_dipilih ? `<span class="${APP.gradeClass(t.grade_dipilih)}">Grade ${t.grade_dipilih}</span>` : ''}
                ${sumberBadges.join('')}
                <span class="${APP.statusClass(t.status)}">${t.status}</span>
              </div>
              <div class="font-medium text-sm text-slate-800 leading-snug">${APP.esc(item.uraian_parameter)}</div>
              ${ev.length > 0 ? `
                <div class="text-xs text-slate-500 mt-1.5 flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                  </svg>
                  ${ev.filter(e => e.status === 'terupload').length}/${ev.length} dokumen terupload
                </div>
              ` : ''}
            </div>

            <div class="pt-1 shrink-0 text-slate-400">
              <svg class="w-5 h-5 chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </div>
          </summary>

          <div class="px-5 pb-5 pt-2 bg-slate-50/50 border-t border-slate-100">
            <div class="text-xs font-semibold text-slate-500 uppercase mt-3 mb-3">Referensi Grade</div>
            ${gradesHtml}

            <div class="mt-5">
              <div class="flex items-center justify-between mb-3">
                <div class="text-xs font-semibold text-slate-500 uppercase">Uraian Hasil Pengujian</div>
                <button onclick="tambahEviden('${item.id_trans}')" class="btn btn-primary text-xs">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                  </svg>
                  Tambah Dokumen
                </button>
              </div>

              ${t.uraian_hasil ? `
                <div class="p-4 rounded-xl bg-white border border-slate-200 text-sm text-slate-700 mb-3 leading-relaxed">
                  ${APP.esc(t.uraian_hasil)}
                </div>
              ` : ''}

              <div class="space-y-2">${evidenHtml}</div>
            </div>

            <div class="mt-5 flex flex-wrap gap-2 justify-end pt-4 border-t border-slate-200">
              <button onclick="ambilLinkUpload('${item.id_trans}')" class="btn btn-secondary text-xs">
                📁 Ambil Link Upload
              </button>
              <button onclick="syncFolder('${item.id_trans}')" class="btn btn-secondary text-xs">
                🔄 Sync Folder
              </button>
              <button onclick="updateStatus('${item.id_trans}', '${t.status}')" class="btn btn-primary text-xs">
                ⚙️ Update Status
              </button>
            </div>
          </div>
        </details>
      `;
    }

    function renderEviden(e) {
      const isUploaded = e.status === 'terupload';
      const icon = e.jenis === 'file' ? '📄' : '🔗';
      const badge = isUploaded
        ? '<span class="badge badge-selesai">✓ Terupload</span>'
        : '<span class="badge badge-revisi">⚠ Belum</span>';

      return `
        <div class="flex items-center gap-3 bg-white border border-slate-200 rounded-xl p-3 hover:shadow-sm transition">
          <div class="w-10 h-10 rounded-xl ${e.jenis === 'file' ? 'bg-rose-50 text-rose-600' : 'bg-blue-50 text-blue-600'} flex items-center justify-center text-lg shrink-0">
            ${icon}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-sm font-medium text-slate-800 truncate">${APP.esc(e.nama_dokumen)}</span>
              ${badge}
            </div>
            <div class="text-xs text-slate-400 truncate mt-0.5">
              ${e.upload_by ? `${APP.esc(e.upload_by)} · ${APP.formatDate(e.upload_at)}` : 'Belum diunggah'}
            </div>
          </div>
          <div class="flex items-center gap-0.5 shrink-0">
            ${e.link ? `<a href="${APP.esc(e.link)}" target="_blank" class="btn btn-ghost p-2 text-blue-700" title="Buka">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
              </svg>
            </a>` : ''}
            <button onclick="editEviden('${e.id_eviden}', '${APP.esc(e.nama_dokumen)}', '${APP.esc(e.link || '')}')"
                    class="btn btn-ghost p-2" title="Edit">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
            </button>
            <button onclick="hapusEviden('${e.id_eviden}', '${APP.esc(e.nama_dokumen)}')"
                    class="btn btn-ghost p-2 hover:!bg-rose-50 hover:!text-rose-600" title="Hapus">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/>
              </svg>
            </button>
          </div>
        </div>
      `;
    }

    function formatPenjelasan(text) {
      if (!text) return '-';
      const lines = String(text).split('\n').filter(l => l.trim());
      if (lines.some(l => l.trim().startsWith('-') || l.trim().startsWith('•'))) {
        const items = lines.map(l => `<li>${APP.esc(l.replace(/^[\s\-•]+/, ''))}</li>`).join('');
        return `<ul class="list-disc pl-5 space-y-0.5">${items}</ul>`;
      }
      return APP.esc(text);
    }

    function filter() {
      const q = document.getElementById('searchParam').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const grade = document.getElementById('filterGrade').value;

      document.querySelectorAll('details[data-id]').forEach(el => {
        const text = el.textContent.toLowerCase();
        let show = true;
        if (q && !text.includes(q)) show = false;
        if (status && !el.textContent.includes(status)) show = false;
        if (grade && !el.textContent.includes('Grade ' + grade)) show = false;
        el.style.display = show ? '' : 'none';
      });
    }

    // Actions
    async function ambilLinkUpload(idTrans) {
      try {
        const result = await API.getUploadLink(idTrans);
        window.open(result.folder_url, '_blank');
      } catch (err) { alert('Gagal: ' + err.message); }
    }

    async function syncFolder(idTrans) {
      if (!confirm('Sync file dari folder Drive?')) return;
      try {
        const r = await API.syncFolder({ id_trans: idTrans });
        alert(`Selesai. ${r.added} file baru, ${r.skipped} dilewati.`);
        loadChecklist();
      } catch (err) { alert('Gagal: ' + err.message); }
    }

    async function tambahEviden(idTrans) {
      const nama = prompt('Nama dokumen:');
      if (!nama) return;
      const link = prompt('Link (opsional):') || '';
      try {
        await API.addEviden({ id_trans: idTrans, nama_dokumen: nama, jenis: link ? 'link' : 'file', link });
        loadChecklist();
      } catch (err) { alert('Gagal: ' + err.message); }
    }

    async function editEviden(idEviden, namaLama, linkLama) {
      const nama = prompt('Nama dokumen:', namaLama);
      if (nama === null) return;
      const link = prompt('Link:', linkLama);
      if (link === null) return;
      try {
        await API.updateEviden({ id_eviden: idEviden, nama_dokumen: nama, link });
        loadChecklist();
      } catch (err) { alert('Gagal: ' + err.message); }
    }

    async function hapusEviden(idEviden, nama) {
      if (!confirm(`Hapus "${nama}"?`)) return;
      try {
        await API.deleteEviden({ id_eviden: idEviden });
        loadChecklist();
      } catch (err) { alert('Gagal: ' + err.message); }
    }

    async function updateStatus(idTrans, statusSekarang) {
      const status = prompt('Status baru (Belum/Proses/Upload/Verifikasi/Selesai/Revisi):', statusSekarang);
      if (!status) return;
      try {
        await API.saveStatus({ id_trans: idTrans, status });
        loadChecklist();
      } catch (err) { alert('Gagal: ' + err.message); }
    }

    init();
  </script>
</body>
</html>
