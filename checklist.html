<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checklist — SPIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] .chevron { transform: rotate(90deg); }
    .chevron { transition: transform .2s; }
    .penjelasan ul { list-style: disc; padding-left: 1.25rem; }
    .penjelasan ul li { margin-top: 2px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <div id="navbar"></div>

  <main class="max-w-7xl mx-auto px-4 py-6">

    <div class="text-sm text-gray-500 mb-4">
      <a href="dashboard.html" class="hover:underline">Dashboard</a>
      <span class="mx-1">/</span>
      <span id="breadcrumb" class="text-gray-700 font-medium">Checklist</span>
    </div>

    <div id="headerKK" class="mb-5"></div>

    <div class="bg-white rounded-lg shadow p-3 mb-5 flex flex-wrap gap-3 items-center">
      <input type="text" id="searchParam" placeholder="Cari parameter..."
             class="border rounded-lg px-3 py-2 text-sm flex-1 min-w-[200px]"/>
      <select id="filterStatus" class="border rounded-lg px-3 py-2 text-sm">
        <option value="">Semua Status</option>
        <option>Belum</option><option>Proses</option><option>Upload</option>
        <option>Verifikasi</option><option>Selesai</option><option>Revisi</option>
      </select>
      <select id="filterGrade" class="border rounded-lg px-3 py-2 text-sm">
        <option value="">Semua Grade</option>
        <option>A</option><option>B</option><option>C</option><option>D</option><option>E</option>
      </select>
    </div>

    <div id="content"></div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    AUTH.requireLogin();
    document.getElementById('navbar').innerHTML = APP.renderNavbar('checklist');

    const params = new URLSearchParams(location.search);
    let kodeKK = params.get('kk') || '';
    let unit = params.get('unit');
    let periode = params.get('periode');

    let allData = [];

    async function init() {
      // Kalau tidak ada unit/periode di URL, ambil dari user
      const user = AUTH.getUser();
      if (!unit) unit = user.kode_unit;
      if (!periode) {
        const periodes = await API.getPeriodes();
        const aktif = periodes.find(p => p.status === 'aktif');
        periode = aktif ? aktif.periode : '';
      }

      loadChecklist();
    }

    async function loadChecklist() {
      const content = document.getElementById('content');
      APP.showLoading(content);

      try {
        allData = await API.getChecklist(unit, periode, kodeKK);
        renderHeader();
        renderList(allData);
      } catch (err) {
        APP.showError(content, err.message);
      }
    }

    function renderHeader() {
      const header = document.getElementById('headerKK');
      if (!kodeKK || allData.length === 0) {
        header.innerHTML = '';
        document.getElementById('breadcrumb').textContent = 'Semua KK';
        return;
      }

      const first = allData[0];
      const total = allData.length;
      const selesai = allData.filter(d => d.trans.status === 'Selesai').length;
      const progress = total > 0 ? Math.round((selesai / total) * 100) : 0;

      document.getElementById('breadcrumb').textContent = `KK ${kodeKK} — ${first.subunsur}`;

      header.innerHTML = `
        <div class="bg-white rounded-xl shadow p-5 border-l-4 border-blue-700">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
              <span class="inline-block px-2 py-0.5 bg-blue-100 text-blue-800 text-xs font-mono rounded">KK ${kodeKK}</span>
              <h1 class="text-xl font-bold mt-2">${APP.esc(first.subunsur)}</h1>
              <p class="text-sm text-gray-500 mt-1">
                Unit: <span class="font-medium">${APP.esc(unit)}</span> ·
                Periode: <span class="font-medium">${APP.esc(periode)}</span>
              </p>
            </div>
            <div class="text-right">
              <div class="text-3xl font-bold text-blue-700">${progress}%</div>
              <div class="text-xs text-gray-500">${selesai} dari ${total} selesai</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderList(data) {
      const content = document.getElementById('content');

      if (data.length === 0) {
        content.innerHTML = `
          <div class="bg-white rounded-xl shadow p-12 text-center text-gray-500">
            Tidak ada data checklist untuk filter ini.
          </div>
        `;
        return;
      }

      // Group per subunsur
      const groups = {};
      data.forEach(d => {
        if (!groups[d.kode_kk]) {
          groups[d.kode_kk] = {
            kode_kk: d.kode_kk,
            subunsur: d.subunsur,
            items: []
          };
        }
        groups[d.kode_kk].items.push(d);
      });

      const html = Object.values(groups).map(g => {
        const total = g.items.length;
        const selesai = g.items.filter(i => i.trans.status === 'Selesai').length;

        const itemsHtml = g.items.map(item => renderItem(item)).join('');

        return `
          <div class="bg-white rounded-xl shadow overflow-hidden mb-5">
            <div class="px-5 py-3 bg-gray-50 border-b flex items-center justify-between">
              <h2 class="font-semibold">
                <span class="text-blue-700 font-mono mr-2">${g.kode_kk}</span>
                ${APP.esc(g.subunsur)}
              </h2>
              <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full">
                ${selesai}/${total} selesai
              </span>
            </div>
            <div class="divide-y">
              ${itemsHtml}
            </div>
          </div>
        `;
      }).join('');

      content.innerHTML = html;
      attachEvents();
    }

    function renderItem(item) {
      const t = item.trans;
      const ev = item.eviden || [];

      const statusClass = APP.statusClass(t.status);

      const sumberBadges = [];
      if (item.sumber.spip) sumberBadges.push('<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">SPIP</span>');
      if (item.sumber.mri) sumberBadges.push('<span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">MRI</span>');
      if (item.sumber.iepk) sumberBadges.push('<span class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded">IEPK</span>');

      // Detail panel dengan grade A-E
      const gradesHtml = item.grades.map(g => `
        <div class="border rounded-lg p-3 mb-2 bg-white">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xs px-2 py-0.5 rounded border font-semibold ${APP.gradeClass(g.grade)}">
              Grade ${g.grade}
            </span>
            <span class="text-xs text-gray-500">Cara pengujian: ${APP.esc(g.cara_pengujian)}</span>
          </div>
          <div class="text-xs font-semibold text-gray-500 uppercase mb-1">Kriteria</div>
          <div class="text-sm mb-2">${APP.esc(g.kriteria)}</div>
          <div class="text-xs font-semibold text-gray-500 uppercase mb-1">Penjelasan</div>
          <div class="text-sm penjelasan">${formatPenjelasan(g.penjelasan)}</div>
        </div>
      `).join('');

      // Eviden list
      const evidenHtml = ev.length > 0
        ? ev.map(e => renderEviden(e)).join('')
        : '<div class="text-xs text-gray-400 italic">Belum ada dokumen pendukung</div>';

      return `
        <details class="group" data-id="${item.id_trans}">
          <summary class="p-4 hover:bg-gray-50 flex items-start gap-4">
            <div class="pt-1 shrink-0">
              <div class="w-6 h-6 rounded-full ${
                t.status === 'Selesai' ? 'bg-green-500' :
                t.status === 'Upload' ? 'bg-yellow-500' :
                t.status === 'Belum' ? 'bg-gray-300' : 'bg-blue-500'
              } flex items-center justify-center">
                ${t.status === 'Selesai' ? `
                  <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                  </svg>
                ` : ''}
              </div>
            </div>

            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap mb-1">
                <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-0.5 rounded">
                  Param ${item.no_parameter}
                </span>
                ${t.grade_dipilih ? `<span class="text-xs px-2 py-0.5 rounded border font-semibold ${APP.gradeClass(t.grade_dipilih)}">Grade ${t.grade_dipilih}</span>` : ''}
                ${sumberBadges.join('')}
                <span class="text-xs px-2 py-0.5 rounded border font-medium ${statusClass}">${t.status}</span>
              </div>
              <div class="font-medium text-sm">${APP.esc(item.uraian_parameter)}</div>
              ${ev.length > 0 ? `
                <div class="text-xs text-gray-500 mt-1">
                  📎 ${ev.length} dokumen · ${ev.filter(e => e.status === 'terupload').length} terupload
                </div>
              ` : ''}
            </div>

            <div class="pt-2 shrink-0 text-gray-400">
              <svg class="w-5 h-5 chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </div>
          </summary>

          <div class="px-5 pb-5 pt-1 bg-gray-50 border-t">
            <div class="text-xs font-semibold text-gray-500 uppercase mb-2 mt-3">Referensi Grade</div>
            ${gradesHtml}

            <div class="mt-4 mb-2">
              <div class="flex items-center justify-between mb-2">
                <div class="text-xs font-semibold text-gray-500 uppercase">Uraian Hasil Pengujian</div>
                <button onclick="tambahEviden('${item.id_trans}')"
                        class="text-xs bg-blue-700 hover:bg-blue-800 text-white px-3 py-1.5 rounded-lg">
                  + Tambah Dokumen
                </button>
              </div>
              ${t.uraian_hasil ? `
                <div class="bg-white border rounded-lg p-3 text-sm mb-3">${APP.esc(t.uraian_hasil)}</div>
              ` : ''}
              <div class="space-y-2">${evidenHtml}</div>
            </div>

            <div class="mt-4 flex flex-wrap gap-2 justify-end border-t pt-4">
              <button onclick="ambilLinkUpload('${item.id_trans}')"
                      class="text-xs border border-gray-300 hover:bg-white text-gray-700 px-3 py-2 rounded-lg">
                📁 Ambil Link Upload
              </button>
              <button onclick="syncFolder('${item.id_trans}')"
                      class="text-xs border border-gray-300 hover:bg-white text-gray-700 px-3 py-2 rounded-lg">
                🔄 Sync Folder
              </button>
              <button onclick="updateStatus('${item.id_trans}', '${t.status}')"
                      class="text-xs bg-blue-700 hover:bg-blue-800 text-white px-3 py-2 rounded-lg">
                ⚙️ Update Status
              </button>
            </div>
          </div>
        </details>
      `;
    }

    function renderEviden(e) {
      const isUploaded = e.status === 'terupload';
      const icon = e.jenis === 'file' ? '📄' : '🔗';
      const badge = isUploaded
        ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">✓ Terupload</span>'
        : '<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">⚠ Belum</span>';

      return `
        <div class="flex items-center gap-3 bg-white border rounded-lg p-3">
          <div class="text-2xl shrink-0">${icon}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-sm font-medium truncate">${APP.esc(e.nama_dokumen)}</span>
              ${badge}
            </div>
            <div class="text-xs text-gray-400 truncate">
              ${e.upload_by ? `oleh ${APP.esc(e.upload_by)} · ${APP.formatDate(e.upload_at)}` : 'Belum diunggah'}
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            ${e.link ? `<a href="${APP.esc(e.link)}" target="_blank" class="text-xs text-blue-700 hover:bg-blue-50 px-2 py-1.5 rounded">Buka</a>` : ''}
            <button onclick="editEviden('${e.id_eviden}', '${APP.esc(e.nama_dokumen)}', '${APP.esc(e.link || '')}')"
                    class="text-xs text-gray-600 hover:bg-gray-100 px-2 py-1.5 rounded">Edit</button>
            <button onclick="hapusEviden('${e.id_eviden}', '${APP.esc(e.nama_dokumen)}')"
                    class="text-xs text-red-600 hover:bg-red-50 px-2 py-1.5 rounded">Hapus</button>
          </div>
        </div>
      `;
    }

    function formatPenjelasan(text) {
      if (!text) return '-';
      // Kalau ada "- " di awal baris, ubah jadi <ul><li>
      const lines = String(text).split('\n').filter(l => l.trim());
      if (lines.some(l => l.trim().startsWith('-') || l.trim().startsWith('•'))) {
        const items = lines.map(l => `<li>${APP.esc(l.replace(/^[\s\-•]+/, ''))}</li>`).join('');
        return `<ul>${items}</ul>`;
      }
      return APP.esc(text);
    }

    function attachEvents() {
      document.getElementById('searchParam').addEventListener('input', filterList);
      document.getElementById('filterStatus').addEventListener('change', filterList);
      document.getElementById('filterGrade').addEventListener('change', filterList);
    }

    function filterList() {
      const q = document.getElementById('searchParam').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const grade = document.getElementById('filterGrade').value;

      document.querySelectorAll('details[data-id]').forEach(el => {
        const text = el.textContent.toLowerCase();
        let show = true;
        if (q && !text.includes(q)) show = false;
        if (status && !el.textContent.includes(status)) show = false;
        if (grade && !el.textContent.includes('Grade ' + grade)) show = false;
        el.style.display = show ? '' : 'none';
      });
    }

    // ===== ACTIONS =====

    async function ambilLinkUpload(idTrans) {
      try {
        const result = await API.getUploadLink(idTrans);
        window.open(result.folder_url, '_blank');
        alert('Folder siap. URL sudah dibuka di tab baru.\n\n' + result.folder_url);
      } catch (err) {
        alert('Gagal: ' + err.message);
      }
    }

    async function syncFolder(idTrans) {
      if (!confirm('Sync file dari folder Drive ke daftar eviden?')) return;
      try {
        const result = await API.syncFolder({ id_trans: idTrans });
        alert(`Selesai. ${result.added} file baru, ${result.skipped} dilewati.`);
        loadChecklist();
      } catch (err) {
        alert('Gagal: ' + err.message);
      }
    }

    async function tambahEviden(idTrans) {
      const nama = prompt('Nama dokumen:');
      if (!nama) return;
      const link = prompt('Link (opsional, kosongkan kalau belum upload):') || '';

      try {
        await API.addEviden({
          id_trans: idTrans,
          nama_dokumen: nama,
          jenis: link ? 'link' : 'file',
          link: link
        });
        loadChecklist();
      } catch (err) {
        alert('Gagal: ' + err.message);
      }
    }

    async function editEviden(idEviden, namaLama, linkLama) {
      const nama = prompt('Nama dokumen:', namaLama);
      if (nama === null) return;
      const link = prompt('Link:', linkLama);
      if (link === null) return;

      try {
        await API.updateEviden({
          id_eviden: idEviden,
          nama_dokumen: nama,
          link: link
        });
        loadChecklist();
      } catch (err) {
        alert('Gagal: ' + err.message);
      }
    }

    async function hapusEviden(idEviden, nama) {
      if (!confirm(`Hapus dokumen "${nama}"?`)) return;
      try {
        await API.deleteEviden({ id_eviden: idEviden });
        loadChecklist();
      } catch (err) {
        alert('Gagal: ' + err.message);
      }
    }

    async function updateStatus(idTrans, statusSekarang) {
      const status = prompt(
        'Status baru (Belum/Proses/Upload/Verifikasi/Selesai/Revisi):',
        statusSekarang
      );
      if (!status) return;

      try {
        await API.saveStatus({
          id_trans: idTrans,
          status: status
        });
        loadChecklist();
      } catch (err) {
        alert('Gagal: ' + err.message);
      }
    }

    init();
  </script>
</body>
</html>
