<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SPIP Eviden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">

  <div class="login-card w-full max-w-md bg-white/95 rounded-3xl shadow-2xl p-8 md:p-10 animate-fade-in">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 shadow-lg shadow-blue-500/30 mb-4">
        <span class="text-3xl">📋</span>
      </div>
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800">SPIP Eviden</h1>
      <p class="text-sm text-slate-500 mt-2">Sistem Pemantauan Eviden & Penilaian SPIP</p>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <input type="text" id="username" required autofocus
                 class="input pl-10" placeholder="Masukkan username"/>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input type="password" id="password" required
                 class="input pl-10 pr-10" placeholder="••••••••"/>
          <button type="button" onclick="togglePassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="errorMsg" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-xl p-3">
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary w-full py-3 text-base">
        <span id="btnText">Masuk</span>
      </button>
    </form>

    <div class="text-center text-xs text-slate-400 mt-6">
      Lupa password? Hubungi admin untuk reset.
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    if (AUTH.isLoggedIn()) window.location.href = 'dashboard.html';

    function togglePassword() {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const errEl = document.getElementById('errorMsg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errEl.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = 'Memproses...';

      try {
        const res = await fetch(CONFIG.API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username, password }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const data = await res.json();

        if (data.success) {
          AUTH.saveUser(data.data.user, data.data.token, data.data.expires_at);
          window.location.href = 'dashboard.html';
        } else {
          errEl.textContent = data.message || 'Login gagal';
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        errEl.textContent = 'Error: ' + err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
