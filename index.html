<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SPIP Eviden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">

  <!-- Constellation Canvas -->
  <canvas id="constellation"></canvas>

  <!-- Cursor Glow -->
  <div id="cursorGlow" class="cursor-glow" style="opacity: 0;"></div>

  <!-- Login Card -->
  <div class="login-card w-full max-w-md bg-white/95 rounded-3xl shadow-2xl p-8 md:p-10 animate-fade-in">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="blob-logo">
        <div class="blob-logo-glow"></div>
        <div class="blob-logo-outer"></div>
        <div class="blob-logo-inner">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
               style="width:46px;height:46px;max-width:46px;max-height:46px;">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
        </div>
      </div>
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800">SPIP Eviden</h1>
      <p class="text-sm text-slate-500 mt-2">Sistem Pemantauan Eviden & Penilaian SPIP</p>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
        <div class="relative">
          <div class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-md shadow-blue-500/30 z-10">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <input type="text" id="username" required autofocus
                 class="w-full pl-14 pr-4 py-3.5 bg-gradient-to-br from-slate-50 to-blue-50/40 border-2 border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 font-medium transition-all duration-200 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 focus:shadow-lg focus:shadow-blue-500/10"
                 placeholder="Masukkan username"/>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
        <div class="relative">
          <div class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-md shadow-blue-500/30 z-10">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <input type="password" id="password" required
                 class="w-full pl-14 pr-12 py-3.5 bg-gradient-to-br from-slate-50 to-blue-50/40 border-2 border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 font-medium transition-all duration-200 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 focus:shadow-lg focus:shadow-blue-500/10"
                 placeholder="••••••••"/>
          <button type="button" onclick="togglePassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 p-2 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="errorMsg" class="hidden bg-rose-50 border-l-4 border-rose-500 text-rose-700 text-sm rounded-lg p-3 font-medium"></div>

      <button type="submit" id="loginBtn"
              class="w-full relative overflow-hidden group py-4 rounded-xl text-white font-semibold text-base
                     bg-gradient-to-r from-blue-600 via-blue-700 to-blue-800
                     shadow-lg shadow-blue-600/40
                     hover:shadow-xl hover:shadow-blue-600/50 hover:scale-[1.02]
                     active:scale-[0.98]
                     disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:scale-100
                     transition-all duration-200">
        <span class="relative z-10 inline-flex items-center justify-center gap-2">
          <span id="btnText">Masuk</span>
          <svg class="w-5 h-5 transition-transform duration-200 group-hover:translate-x-1"
               fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
        </span>
        <div class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-1000 bg-gradient-to-r from-transparent via-white/25 to-transparent"></div>
      </button>
    </form>

    <div class="text-center text-xs text-slate-400 mt-6">
      Lupa password? Hubungi admin untuk reset.
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    if (AUTH.isLoggedIn()) window.location.href = 'dashboard.html';

    function togglePassword() {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    // ============ CONSTELLATION ============
    (function constellation() {
      const canvas = document.getElementById('constellation');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];

      const isMobile = window.innerWidth < 768;
      const COUNT = isMobile ? 30 : 60;
      const MAX_DIST = isMobile ? 100 : 150;
      let mouse = { x: null, y: null };

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function init() {
        particles = [];
        for (let i = 0; i < COUNT; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            r: Math.random() * 2 + 1
          });
        }
      }

      document.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      document.addEventListener('mouseleave', () => {
        mouse.x = null;
        mouse.y = null;
      });

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        });

        // Garis antar partikel
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < MAX_DIST) {
              ctx.strokeStyle = `rgba(147,197,253,${0.5 * (1 - dist / MAX_DIST)})`;
              ctx.lineWidth = 0.6;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }

        // Garis ke kursor
        if (mouse.x !== null) {
          particles.forEach(p => {
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 180) {
              ctx.strokeStyle = `rgba(96,165,250,${0.6 * (1 - dist / 180)})`;
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.stroke();
            }
          });
        }

        // Partikel
        particles.forEach(p => {
          ctx.fillStyle = 'rgba(191,219,254,0.9)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(147,197,253,0.15)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(animate);
      }

      resize();
      init();
      animate();

      window.addEventListener('resize', () => {
        resize();
        init();
      });
    })();

    // ============ CURSOR GLOW ============
    (function cursorGlow() {
      const cursorGlow = document.getElementById('cursorGlow');
      if (!cursorGlow) return;

      let glowX = window.innerWidth / 2;
      let glowY = window.innerHeight / 2;
      let currentX = glowX;
      let currentY = glowY;

      document.addEventListener('mousemove', (e) => {
        glowX = e.clientX;
        glowY = e.clientY;
        cursorGlow.style.opacity = '1';
      });

      document.addEventListener('mouseleave', () => {
        cursorGlow.style.opacity = '0';
      });

      function animate() {
        currentX += (glowX - currentX) * 0.08;
        currentY += (glowY - currentY) * 0.08;
        cursorGlow.style.left = currentX + 'px';
        cursorGlow.style.top = currentY + 'px';
        requestAnimationFrame(animate);
      }
      animate();
    })();

    // ============ LOGIN ============
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const errEl = document.getElementById('errorMsg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errEl.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = 'Memproses...';

      try {
        const res = await fetch(CONFIG.API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username, password }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const data = await res.json();

        if (data.success) {
          AUTH.saveUser(data.data.user, data.data.token, data.data.expires_at);
          window.location.href = 'dashboard.html';
        } else {
          errEl.textContent = data.message || 'Login gagal';
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        errEl.textContent = 'Error: ' + err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
