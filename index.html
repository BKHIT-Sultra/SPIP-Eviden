<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Checklist SPIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-2xl mb-4">
        <span class="text-3xl">📋</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Checklist Dokumen SPIP</h1>
      <p class="text-sm text-gray-500 mt-1">Monitoring eviden & progress penilaian</p>
    </div>

    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 text-sm text-blue-800">
      Silakan login menggunakan akun Google instansi Anda.
    </div>

    <div class="flex justify-center mb-6">
      <div id="g_id_onload"
           data-client_id="XXXXX.apps.googleusercontent.com"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="signin_with"
           data-shape="rectangular"
           data-logo_alignment="left"></div>
    </div>

    <div class="text-center text-xs text-gray-400">
      Hanya email terdaftar yang dapat mengakses aplikasi ini.
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Set client ID dari config
    document.querySelector('.g_id_signin').parentElement
      .querySelector('#g_id_onload')
      .setAttribute('data-client_id', CONFIG.GOOGLE_CLIENT_ID);

    function handleCredentialResponse(response) {
      AUTH.handleCredential(response);
    }

    // Redirect kalau sudah login
    if (AUTH.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
