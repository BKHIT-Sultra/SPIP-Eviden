<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KKLEAD III — Pencapaian Tujuan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>

  <script>
    AUTH.requireLogin();
    LAYOUT.render('KKLEAD III');
  </script>

  <script>
    const params = new URLSearchParams(location.search);
    let unit = params.get('unit');
    let periode = params.get('periode');

    async function initKKLead3() {
      const user = AUTH.getUser();
      if (!unit) unit = user?.kode_unit || '';
      if (!periode) {
        const periodes = await API.getPeriodes();
        const aktif = periodes.find(p => String(p.status || '').toLowerCase().trim() === 'aktif');
        periode = aktif ? String(aktif.periode).replace(/\.0+$/, '') : '';
      }

      LAYOUT.setTitle('KKLEAD III — Pencapaian Tujuan', `Unit: ${unit} · Periode: ${periode}`);

      const el = LAYOUT.content();
      el.innerHTML = `
        <!-- Info Panel -->
        <div class="card p-5 mb-5 border-l-4 border-emerald-600 bg-emerald-50/30 animate-fade-in">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
              </svg>
            </div>
            <div class="flex-1">
              <h2 class="font-bold text-slate-800 mb-1">Pencapaian Tujuan</h2>
              <p class="text-sm text-slate-600 leading-relaxed">
                Penilaian atas hasil yang dicapai organisasi. Meliputi capaian outcome & output,
                keandalan laporan keuangan, pengamanan aset, dan ketaatan pada peraturan.
              </p>
            </div>
          </div>
        </div>

        <!-- Menu Sub -->
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
          ${subMenuCard('Capaian Outcome', 'Hasil jangka panjang organisasi', 'chart', 'emerald')}
          ${subMenuCard('Capaian Output', 'Keluaran langsung kegiatan', 'box', 'blue')}
          ${subMenuCard('Keandalan Laporan Keuangan', 'Kualitas & ketepatan laporan', 'file', 'violet')}
          ${subMenuCard('Pengamanan Aset Negara', 'Perlindungan aset organisasi', 'shield', 'amber')}
          ${subMenuCard('Ketaatan pada Peraturan', 'Kepatuhan terhadap regulasi', 'scale', 'rose')}
        </div>

        <!-- Info Coming Soon -->
        <div class="card p-12 text-center animate-fade-in">
          <div class="text-6xl mb-4">🚧</div>
          <div class="text-lg font-semibold text-slate-800 mb-2">Dalam Pengembangan</div>
          <div class="text-sm text-slate-500 max-w-md mx-auto leading-relaxed">
            Modul <b>KKLEAD III</b> sedang dalam tahap pengembangan.
            Silakan hubungi admin untuk informasi lebih lanjut.
          </div>
        </div>
      `;
    }

    function subMenuCard(title, desc, icon, color) {
      const colors = {
        emerald: 'from-emerald-500 to-emerald-600',
        blue:    'from-blue-500 to-blue-600',
        violet:  'from-violet-500 to-violet-600',
        amber:   'from-amber-500 to-amber-600',
        rose:    'from-rose-500 to-rose-600'
      };
      const icons = {
        chart:  '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>',
        box:    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>',
        file:   '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>',
        shield: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>',
        scale:  '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/>'
      };
      return `
        <div class="card p-5 hover:shadow-md transition cursor-pointer animate-fade-in">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${colors[color]} flex items-center justify-center text-white mb-3 shadow-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">${icons[icon]}</svg>
          </div>
          <div class="font-semibold text-slate-800 text-sm mb-1">${title}</div>
          <div class="text-xs text-slate-500 leading-relaxed">${desc}</div>
        </div>
      `;
    }

    initKKLead3();
  </script>
</body>
</html>
