<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KKLEAD I — Penetapan Tujuan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

  <!-- LIBRARY -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>

  <script>
    AUTH.requireLogin();
    LAYOUT.render('kklead1');
  </script>

  <!-- MODAL EVIDEN (copy dari checklist.html) -->
  <div id="modalEviden" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 modal-overlay">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full modal-content">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modalTitle" class="font-bold text-lg text-slate-800">Tambah Item Lampiran</h3>
        <button onclick="ModalEviden.close()" class="btn btn-ghost p-1.5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div id="modalGradeInfo" class="hidden bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-xs text-blue-700">
          Menambahkan untuk <span id="modalGradeText" class="font-semibold">Grade A</span>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Nama Item Lampiran <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="modalNama" required class="input" placeholder="mis. Dokumen Penilaian"/>
        </div>
        <div id="modalFileGroup" class="hidden">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            File Dokumen <span class="text-rose-500">*</span>
          </label>
          <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-blue-400 rounded-xl p-6 text-center cursor-pointer transition bg-slate-50">
            <input type="file" id="fileInput" class="hidden" />
            <div id="dropZoneContent">
              <svg class="w-10 h-10 mx-auto text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
              </svg>
              <div class="text-sm text-slate-600 font-medium">Klik untuk pilih file</div>
              <div class="text-xs text-slate-400 mt-1">atau drag & drop</div>
            </div>
            <div id="filePreview" class="hidden text-left">
              <div class="flex items-center gap-3 bg-white border border-slate-200 rounded-lg p-3">
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-medium truncate" id="fileNameText">-</div>
                  <div class="text-xs text-slate-400" id="fileSizeText">-</div>
                </div>
                <button type="button" onclick="ModalEviden.clearFile(event)"
                        class="btn btn-ghost p-1.5 text-rose-600">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div id="uploadProgress" class="hidden mt-3">
            <div class="flex justify-between text-xs text-slate-500 mb-1">
              <span>Mengunggah...</span>
              <span id="progressText">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
              <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-2">
        <button onclick="ModalEviden.close()" class="btn btn-secondary text-sm">Batal</button>
        <button id="modalSubmitBtn" onclick="ModalEviden.submit()" class="btn btn-primary text-sm">Simpan</button>
      </div>
    </div>
  </div>

  <!-- MODAL HAPUS -->
  <div id="modalHapus" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 modal-overlay">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-5 modal-content">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <div>
          <div class="font-semibold text-slate-800">Hapus Item?</div>
          <div class="text-xs text-slate-500">Tidak dapat dibatalkan.</div>
        </div>
      </div>
      <div class="bg-slate-50 border rounded-lg p-3 text-sm mb-4">
        <div id="hapusNamaText" class="font-medium text-slate-800">-</div>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="ModalHapus.close()" class="btn btn-secondary text-sm">Batal</button>
        <button onclick="ModalHapus.confirm()" class="btn btn-danger text-sm">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <!-- MODAL PIC -->
  <div id="modalPIC" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 modal-overlay">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full modal-content">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-lg text-slate-800">Set PIC</h3>
        <button onclick="ModalPIC.close()" class="btn btn-ghost p-1.5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div class="bg-slate-50 border rounded-lg px-3 py-2 text-xs">
          <div id="modalPICIdText" class="font-mono text-slate-500">-</div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Pilih User</label>
          <select id="modalPICUser" class="input" onchange="ModalPIC.onUserSelect()">
            <option value="">— Pilih user —</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Nama PIC</label>
          <input type="text" id="modalPICNama" class="input" placeholder="Nama PIC"/>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-2">
        <button onclick="ModalPIC.close()" class="btn btn-secondary text-sm">Batal</button>
        <button id="modalPICSubmitBtn" onclick="ModalPIC.submit()" class="btn btn-primary text-sm">Simpan</button>
      </div>
    </div>
  </div>

  <!-- MODULES (reuse dari checklist) -->
  <script src="assets/js/checklist-modal.js"></script>

  <!-- SCRIPT KKLEAD I -->
  <script>
    // Config khusus KKLEAD I
    const KKLEAD_FILTER = {
      prefix: 'L',
      title: 'KKLEAD I — Penetapan Tujuan',
      subtitle: 'Penilaian Kualitas Sasaran & Strategi Pencapaian'
    };

    const params = new URLSearchParams(location.search);
    let unit = params.get('unit');
    let periode = params.get('periode');
    let allData = [];

    async function initKKLead1() {
      const user = AUTH.getUser();
      if (!unit) unit = user?.kode_unit || '';

      if (!periode) {
        const periodes = await API.getPeriodes();
        let aktif = periodes.find(p => String(p.status || '').toLowerCase().trim() === 'aktif');
        if (!aktif) aktif = periodes[periodes.length - 1];
        periode = aktif ? String(aktif.periode).replace(/\.0+$/, '') : '';
      }

      LAYOUT.setTitle(KKLEAD_FILTER.title, `Unit: ${unit} · Periode: ${periode}`);

      loadData();
    }

    async function loadData() {
      const el = LAYOUT.content();
      el.innerHTML = APP.loadingBox('Memuat checklist...');

      try {
        // Load semua checklist, filter di frontend
        const all = await API.getChecklist(unit, periode, '');
        // Filter hanya kode_kk yang mulai dengan 'L'
        allData = all.filter(d => String(d.kode_kk).startsWith(KKLEAD_FILTER.prefix));
        render();
      } catch (err) {
        el.innerHTML = APP.errorBox(err.message);
      }
    }

    function render() {
      const el = LAYOUT.content();

      if (allData.length === 0) {
        el.innerHTML = `
          <div class="card p-12 text-center">
            <div class="text-5xl mb-4">📭</div>
            <div class="text-lg font-semibold text-slate-800 mb-2">Belum ada data KKLEAD I</div>
            <div class="text-sm text-slate-500 mb-4">
              Hubungi admin untuk seed Master_Checklist & generate Trans_Checklist untuk kode KKLEAD I.
            </div>
            <div class="text-xs text-slate-400">
              Kode yang dicari: <span class="font-mono">${KKLEAD_FILTER.prefix}*</span>
            </div>
          </div>
        `;
        return;
      }

      // Render per KK
      const html = allData.map(item => renderKKLeadCard(item)).join('');

      el.innerHTML = `
        <!-- Info Panel -->
        <div class="card p-5 mb-5 border-l-4 border-emerald-600 bg-emerald-50/30 animate-fade-in">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <div class="flex-1">
              <h2 class="font-bold text-slate-800 mb-1">Penetapan Tujuan</h2>
              <p class="text-sm text-slate-600 leading-relaxed">
                Penilaian atas kualitas perumusan tujuan dan strategi pencapaiannya.
              </p>
            </div>
          </div>
        </div>

        <div class="space-y-4">${html}</div>
      `;
    }

    function renderKKLeadCard(item) {
      const t = item.trans;
      const ev = item.eviden || [];
      const terupload = ev.filter(e => e.status === 'terupload').length;

      // Ambil grade pertama (default 'A' untuk KKLEAD I)
      const grade = item.grades[0]?.grade || 'A';
      const namaEsc = (s) => APP.esc(s || '').replace(/'/g, "\\'");

      return `
        <div class="card p-5 animate-fade-in">
          <div class="flex items-start justify-between gap-4 mb-4 flex-wrap">
            <div class="flex items-start gap-3 flex-1 min-w-0">
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center text-white font-bold text-sm shrink-0 shadow-lg shadow-emerald-500/30">
                ${item.kode_kk}
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="font-bold text-slate-800 text-base mb-1">
                  ${APP.esc(item.subunsur)}
                </h3>
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="${APP.statusClass(t.status)}">${t.status}</span>
                  ${ev.length > 0 ? `<span class="badge bg-emerald-100 text-emerald-700">📎 ${terupload}/${ev.length}</span>` : ''}
                  ${t.pic ? `
                    <span class="inline-flex items-center gap-1 text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md border border-blue-200">
                    <span class="inline-flex items-center gap-1 text-xs bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-md border border-emerald-200">
                      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                      </svg>
                      ${APP.esc(t.pic)}
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>

            <!-- Aksi -->
            <div class="flex items-center gap-1.5 flex-wrap">
              <button onclick="openModalPIC('${item.id_trans}', '${namaEsc(t.pic)}')"
                      class="inline-flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-emerald-50 hover:border-emerald-300 hover:text-emerald-700 active:scale-95 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                <span class="hidden sm:inline">${t.pic ? 'Ubah PIC' : 'Set PIC'}</span>
              </button>
              <button onclick="ambilLinkUpload('${item.id_trans}')"
                      class="inline-flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-emerald-50 hover:border-emerald-300 hover:text-emerald-700 active:scale-95 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                </svg>
                <span class="hidden sm:inline">Ambil Link</span>
              </button>
              <button onclick="updateStatus('${item.id_trans}', '${t.status}')"
                      class="inline-flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded-lg text-white bg-gradient-to-r from-emerald-600 to-emerald-700 shadow-md shadow-emerald-500/30 hover:from-emerald-700 hover:to-emerald-800 active:scale-95 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <span class="hidden sm:inline">Update</span>
              </button>
            </div>
          </div>

          <!-- Daftar Dokumen -->
          <div class="border border-slate-200 rounded-xl bg-white overflow-hidden">
            ${ev.length > 0 ? `
              <div class="divide-y divide-slate-100">
                ${ev.map((e, idx) => renderEvidenRow(e, idx + 1)).join('')}
              </div>
            ` : ''}

            <div class="p-3 bg-slate-50/50">
              <button onclick="openModalTambah('${item.id_trans}', '${grade}')"
                      class="w-full text-xs text-slate-600 hover:text-emerald-700 hover:bg-white border border-dashed border-slate-300 hover:border-emerald-400 rounded-lg py-2.5 inline-flex items-center justify-center gap-1.5 transition font-medium">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Tambah Item Lampiran
              </button>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * Render baris eviden (copy dari checklist-render.js)
     */
    function renderEvidenRow(e, nomor) {
      const isUploaded = e.status === 'terupload';
      const isFile = e.jenis === 'file';

      const iconHtml = isUploaded
        ? (isFile
            ? `<div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center shrink-0">
                 <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                         d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                 </svg>
               </div>`
            : `<div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
                 <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                         d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                 </svg>
               </div>`)
        : `<div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center shrink-0">
             <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                     d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
             </svg>
           </div>`;

      let subtitle = '';
      if (isUploaded) {
        if (isFile) {
          subtitle = [e.file_name, e.ukuran, e.upload_by, e.upload_at ? APP.formatDate(e.upload_at) : '']
            .filter(Boolean).join(' · ');
        } else {
          subtitle = [e.link, e.upload_by, e.upload_at ? APP.formatDate(e.upload_at) : '']
            .filter(Boolean).join(' · ');
        }
      } else {
        subtitle = 'Belum ada dokumen — klik Upload';
      }

      const badge = isUploaded
        ? `<span class="badge badge-selesai">✓ Terupload</span>`
        : `<span class="badge badge-revisi">⚠ Belum</span>`;

      const namaEsc = APP.esc(e.nama_dokumen || '').replace(/'/g, "\\'");
      const linkEsc = APP.esc(e.link || '').replace(/'/g, "\\'");

      const actionBtn = isUploaded
        ? `<a href="${APP.esc(e.link || '#')}" target="_blank"
              class="btn btn-ghost p-2 text-blue-700 hover:bg-blue-50" title="Buka">
             <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                     d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
             </svg>
           </a>`
        : `<button onclick="openModalUpload('${e.id_eviden}', '${namaEsc}')"
                   class="btn btn-primary text-xs px-3 py-1.5" title="Upload">
             <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                     d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
             </svg>
             Upload
           </button>`;

      return `
        <div class="flex items-start gap-3 px-4 py-3 hover:bg-slate-50 transition">
          <div class="text-sm font-semibold text-slate-400 w-6 pt-2.5 shrink-0 text-right">${nomor}.</div>
          ${iconHtml}
          <div class="flex-1 min-w-0 pt-0.5">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-sm font-medium text-slate-800 break-words">${APP.esc(e.nama_dokumen)}</span>
              ${badge}
            </div>
            <div class="text-xs text-slate-400 mt-0.5 break-all">${APP.esc(subtitle)}</div>
          </div>
          <div class="flex items-center gap-0.5 shrink-0 pt-1">
            ${actionBtn}
            <button onclick="openModalEdit('${e.id_eviden}', '${namaEsc}', '${linkEsc}')"
                    class="btn btn-ghost p-2" title="Edit">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
            </button>
            <button onclick="openModalHapus('${e.id_eviden}', '${namaEsc}')"
                    class="btn btn-ghost p-2 hover:!bg-rose-50 hover:!text-rose-600" title="Hapus">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/>
              </svg>
            </button>
          </div>
        </div>
      `;
    }

    /**
     * Actions — copy dari checklist-main.js
     */
    async function ambilLinkUpload(idTrans) {
      try {
        const result = await API.getUploadLink(idTrans);
        window.open(result.folder_url, '_blank');
      } catch (err) { alert('Gagal: ' + err.message); }
    }

    async function updateStatus(idTrans, statusSekarang) {
      const status = prompt('Status baru (Belum/Proses/Upload/Verifikasi/Selesai/Revisi):', statusSekarang);
      if (!status) return;
      try {
        await API.saveStatus({ id_trans: idTrans, status: status });
        loadData();
      } catch (err) { alert('Gagal: ' + err.message); }
    }

    // Expose agar dipanggil modal
    window.loadChecklist = loadData;

    initKKLead1();
  </script>
