<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil — SPIP Eviden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

  <!-- ============================================== -->
  <!-- LIBRARY                                        -->
  <!-- ============================================== -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>

  <script>
    // ✅ WAJIB: cek login + render layout (sidebar + topbar)
    AUTH.requireLogin();
    LAYOUT.render('profil');
  </script>

  <!-- ============================================== -->
  <!-- KONTEN PROFIL (di dalam LAYOUT.content())      -->
  <!-- ============================================== -->
  <script>
    function renderProfil() {
      const user = AUTH.getUser();
      if (!user) return;

      LAYOUT.setTitle('Profil & Ganti Password', 'Kelola akun Anda');

      const initials = (user.nama || 'U').split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();

      LAYOUT.content().innerHTML = `
        <div class="max-w-3xl mx-auto space-y-5 animate-fade-in">

          <!-- Kartu Info User -->
          <div class="card p-6">
            <div class="flex items-center gap-4 mb-6">
              <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white text-2xl font-bold shadow-lg">
                ${initials}
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-xl font-bold text-slate-800 truncate">${APP.esc(user.nama)}</div>
                <div class="text-sm text-slate-500">@${APP.esc(user.username)}</div>
                <div class="flex flex-wrap gap-2 mt-2">
                  <span class="badge badge-proses">${APP.esc(user.role)}</span>
                  ${user.kode_unit ? `<span class="badge bg-slate-100 text-slate-700">${APP.esc(user.kode_unit)}</span>` : ''}
                </div>
              </div>
            </div>

            <div class="border-t border-slate-100 pt-4 grid md:grid-cols-2 gap-4">
              <div>
                <div class="text-xs font-semibold text-slate-500 uppercase mb-1">Username</div>
                <div class="text-sm text-slate-800 font-medium">${APP.esc(user.username)}</div>
              </div>
              <div>
                <div class="text-xs font-semibold text-slate-500 uppercase mb-1">Nama Lengkap</div>
                <div class="text-sm text-slate-800 font-medium">${APP.esc(user.nama)}</div>
              </div>
              <div>
                <div class="text-xs font-semibold text-slate-500 uppercase mb-1">Role</div>
                <div class="text-sm text-slate-800 font-medium">${APP.esc(user.role)}</div>
              </div>
              <div>
                <div class="text-xs font-semibold text-slate-500 uppercase mb-1">Unit Kerja</div>
                <div class="text-sm text-slate-800 font-medium">${APP.esc(user.kode_unit || '-')}</div>
              </div>
            </div>
          </div>

          <!-- Kartu Ganti Password -->
          <div class="card p-6">
            <div class="flex items-center gap-3 mb-5">
              <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>
              <div>
                <h2 class="font-bold text-slate-800">Ganti Password</h2>
                <p class="text-xs text-slate-500 mt-0.5">Perbarui password akun Anda secara berkala</p>
              </div>
            </div>

            <form id="pwdForm" class="space-y-4">

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">
                  Password Lama <span class="text-rose-500">*</span>
                </label>
                <input type="password" id="pwdLama" required
                       class="input" placeholder="Masukkan password lama"/>
              </div>

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">
                  Password Baru <span class="text-rose-500">*</span>
                </label>
                <input type="password" id="pwdBaru" required minlength="6"
                       class="input" placeholder="Masukkan password baru"/>
                <div class="text-xs text-slate-400 mt-1">Minimal 6 karakter</div>
              </div>

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">
                  Konfirmasi Password Baru <span class="text-rose-500">*</span>
                </label>
                <input type="password" id="pwdKonfirm" required
                       class="input" placeholder="Ulangi password baru"/>
              </div>

              <div id="pwdMsg" class="hidden text-sm rounded-lg p-3"></div>

              <div class="flex justify-end gap-2 pt-2">
                <button type="submit" class="btn btn-primary">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5 13l4 4L19 7"/>
                  </svg>
                  Simpan Password Baru
                </button>
              </div>
            </form>
          </div>

        </div>
      `;

      // Event submit
      document.getElementById('pwdForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const lama = document.getElementById('pwdLama').value;
        const baru = document.getElementById('pwdBaru').value;
        const konfirm = document.getElementById('pwdKonfirm').value;
        const msg = document.getElementById('pwdMsg');

        // Reset
        msg.className = 'hidden text-sm rounded-lg p-3';

        if (baru !== konfirm) {
          msg.className = 'bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-lg p-3';
          msg.textContent = '⚠ Konfirmasi password tidak cocok';
          return;
        }

        if (baru.length < 6) {
          msg.className = 'bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-lg p-3';
          msg.textContent = '⚠ Password minimal 6 karakter';
          return;
        }

        try {
          await API.post('changePassword', {
            password_lama: lama,
            password_baru: baru
          });

          msg.className = 'bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg p-3';
          msg.textContent = '✓ Password berhasil diubah';

          document.getElementById('pwdForm').reset();

          setTimeout(() => {
            msg.classList.add('hidden');
          }, 3000);

        } catch (err) {
          msg.className = 'bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-lg p-3';
          msg.textContent = '⚠ ' + err.message;
        }
      });
    }

    renderProfil();
  </script>

</body>
</html>
