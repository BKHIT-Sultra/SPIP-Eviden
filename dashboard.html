<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Test Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">Test Dashboard</h1>
    <div id="status" class="bg-white p-4 rounded-lg">Memuat...</div>
    <div id="userInfo" class="bg-white p-4 rounded-lg mt-4"></div>
    <button onclick="AUTH.logout()" class="mt-4 bg-red-600 text-white px-4 py-2 rounded-lg">
      Logout
    </button>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const status = document.getElementById('status');
    const userInfo = document.getElementById('userInfo');

    if (!AUTH.isLoggedIn()) {
      status.textContent = '❌ Belum login, redirect ke index...';
      setTimeout(() => window.location.href = 'index.html', 1000);
    } else {
      status.textContent = '✅ Login berhasil!';
      const user = AUTH.getUser();
      userInfo.innerHTML = `
        <div><b>Username:</b> ${user.username}</div>
        <div><b>Nama:</b> ${user.nama}</div>
        <div><b>Role:</b> ${user.role}</div>
        <div><b>Unit:</b> ${user.kode_unit}</div>
      `;
    }
  </script>
</body>
</html>
