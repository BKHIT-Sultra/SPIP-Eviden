<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — SPIP Eviden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>

  <script>
    AUTH.requireLogin();
    LAYOUT.render('dashboard');
  </script>

  <script>
    LAYOUT.content().innerHTML = `
      <div class="card p-4 mb-6 animate-fade-in">
        <div class="flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[180px] max-w-xs">
            <label class="block text-xs font-medium text-slate-500 mb-1.5">Periode</label>
            <select id="filterPeriode" class="input"></select>
          </div>
          <button onclick="loadDashboard()" class="btn btn-primary">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            Terapkan
          </button>
    
          <!-- ✅ TOMBOL DOWNLOAD REKAP -->
          <button onclick="downloadRekap()"
                  class="inline-flex items-center gap-1.5 px-4 py-2.5 text-sm font-medium rounded-lg
                         bg-white border border-slate-200 text-slate-700
                         hover:bg-emerald-50 hover:border-emerald-300 hover:text-emerald-700
                         active:scale-95 transition-all duration-150">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Download Rekap
          </button>
        </div>
      </div>
      <div id="dashContent"></div>
    `;

    let chartStatus = null, chartKK = null, chartGrade = null;
    let currentUnit = '';

    // ============ INIT ============
    async function init() {
      try {
        const user = AUTH.getUser();
        currentUnit = user?.kode_unit || 'BKHIT-SULTRA';

        const periodes = await API.getPeriodes();
        const normPeriod = (v) => String(v).replace(/\.0+$/, '').trim();

        document.getElementById('filterPeriode').innerHTML = periodes
          .filter(p => String(p.status || '').toLowerCase().trim() === 'aktif')
          .map(p => {
            const clean = normPeriod(p.periode);
            const nama = p.nama_periode || `Tahun ${clean}`;
            return `<option value="${APP.esc(clean)}">${APP.esc(nama)}</option>`;
          })
          .join('');

        loadDashboard();
      } catch (err) {
        LAYOUT.content().innerHTML = APP.errorBox(err.message);
      }
    }

    async function loadDashboard() {
      const periode = document.getElementById('filterPeriode').value;
      const el = document.getElementById('dashContent');
      el.innerHTML = APP.loadingBox('Memuat dashboard...');

      try {
        const data = await API.getDashboard(currentUnit, periode);
        renderDashboard(data, currentUnit, periode);
      } catch (err) {
        el.innerHTML = APP.errorBox(err.message);
      }
    }

    // ============ RENDER ============
    function renderDashboard(data, unit, periode) {
      const el = document.getElementById('dashContent');

      const selesai = data.selesai_parameter || 0;
      const upload  = data.status.Upload || 0;
      const belum   = data.status.Belum || 0;
      const total   = data.total_parameter || 0;

      // Kategorikan KK
      const kkleadGroups = {
        I:   { title: 'KKLEAD I',  subtitle: 'Penetapan Tujuan',  kks: [], total: 0, selesai: 0, total_items: 0, uploaded_items: 0 },
        II:  { title: 'KKLEAD II', subtitle: 'Struktur & Proses', kks: [], total: 0, selesai: 0, total_items: 0, uploaded_items: 0 },
        III: { title: 'KKLEAD III',subtitle: 'Pencapaian Tujuan', kks: [], total: 0, selesai: 0, total_items: 0, uploaded_items: 0 }
      };

      data.per_kk.forEach(kk => {
        const cat = categorizeKK(kk.kode_kk);
        kkleadGroups[cat].kks.push(kk);
        kkleadGroups[cat].total += kk.total;
        kkleadGroups[cat].selesai += kk.selesai;
        kkleadGroups[cat].total_items += kk.total_items || 0;
        kkleadGroups[cat].uploaded_items += kk.uploaded_items || 0;
      
        // ✅ Hitung KK yang selesai (semua parameter di KK tersebut selesai)
        const kkSelesai = kk.total > 0 && kk.selesai === kk.total;
        if (kkSelesai) {
          kkleadGroups[cat].kk_selesai = (kkleadGroups[cat].kk_selesai || 0) + 1;
        }
      });
      
      Object.values(kkleadGroups).forEach(g => {
        g.progress = g.total_items > 0
          ? Math.round((g.uploaded_items / g.total_items) * 100)
          : 0;
        g.total_kk = g.kks.length;
        g.kk_selesai = g.kk_selesai || 0;
      });

      el.innerHTML = `
        <!-- STAT CARDS -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          ${statCard('Total Parameter', total, 'Semua KKLEAD', 'from-blue-500 to-blue-600', '📊')}
          ${statCard('Selesai', selesai, `${data.progress}% eviden lengkap`, 'from-emerald-500 to-emerald-600', '✓')}
          ${statCard('Upload Sebagian', upload, 'perlu ditindaklanjuti', 'from-amber-500 to-amber-600', '📤')}
          ${statCard('Belum Mulai', belum, 'belum ada eviden', 'from-rose-500 to-rose-600', '⚠')}
        </div>

        <!-- PROGRESS KESELURUHAN (berbasis eviden) -->
        <div class="card p-6 mb-6 animate-fade-in">
          <div class="flex flex-wrap justify-between items-center gap-3 mb-3">
            <div>
              <h2 class="font-bold text-slate-800">Progress Keseluruhan</h2>
              <p class="text-xs text-slate-500 mt-0.5">
                ${data.uploaded_items || 0} dari ${data.total_items || 0} item lampiran terupload
                · ${selesai} dari ${total} parameter selesai
              </p>
            </div>
            <div class="text-right">
              <div class="text-4xl font-bold text-blue-700">${data.progress}%</div>
            </div>
          </div>

          <div class="progress-bar mb-4">
            <div style="width: ${data.progress}%"></div>
          </div>

          <div class="flex flex-wrap gap-2">
            ${statusChip('Selesai', selesai, 'bg-emerald-100 text-emerald-700')}
            ${statusChip('Upload', upload, 'bg-amber-100 text-amber-700')}
            ${statusChip('Belum', belum, 'bg-slate-100 text-slate-700')}
          </div>
        </div>

        <!-- 3 CARD KKLEAD -->
        <div class="grid md:grid-cols-3 gap-4 mb-6">
          ${renderKKLeadCard('I',   kkleadGroups.I,   unit, periode)}
          ${renderKKLeadCard('II',  kkleadGroups.II,  unit, periode)}
          ${renderKKLeadCard('III', kkleadGroups.III, unit, periode)}
        </div>

        <!-- ============================================ -->
        <!-- CARD KHUSUS KKLEAD II — Distribusi Grade      -->
        <!-- ============================================ -->
        ${renderGradeDistribution(data.grade_distribution || {})}

        <!-- CHARTS -->
        <div class="grid lg:grid-cols-3 gap-6 mb-6">
          <div class="card p-5 animate-fade-in-delay-1">
            <h2 class="font-bold text-slate-800 mb-3 text-sm">Distribusi Status</h2>
            <div class="flex items-center justify-center" style="height: 220px;">
              <canvas id="chartStatus"></canvas>
            </div>
          </div>
          <div class="card p-5 lg:col-span-2 animate-fade-in-delay-2">
            <h2 class="font-bold text-slate-800 mb-3 text-sm">Progress per KK</h2>
            <div style="height: 220px;">
              <canvas id="chartKK"></canvas>
            </div>
          </div>
        </div>

        <!-- TABEL PER KK -->
        <div class="card overflow-hidden animate-fade-in-delay-3">
          <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between flex-wrap gap-2">
            <div>
              <h2 class="font-bold text-slate-800">Rincian per Kelompok Kriteria</h2>
              <p class="text-xs text-slate-500 mt-0.5">Progress dihitung dari item lampiran yang terupload</p>
            </div>
            <div class="text-xs text-slate-500">Total ${data.per_kk.length} KK</div>
          </div>
          <div class="overflow-x-auto">
            <table class="table-modern">
              <thead>
                <tr>
                  <th>Kode</th>
                  <th class="text-center">Parameter</th>
                  <th class="text-center">Item Lampiran</th>
                  <th class="text-center">Selesai</th>
                  <th>Progress</th>
                  <th class="text-center">Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${data.per_kk.length === 0 ? `
                  <tr>
                    <td colspan="6" class="text-center py-8 text-slate-400">
                      Belum ada data untuk periode ini
                    </td>
                  </tr>
                ` : data.per_kk.map(kk => {
                  const progressColor = kk.progress >= 75 ? 'linear-gradient(90deg,#10b981,#059669)' :
                                        kk.progress >= 50 ? 'linear-gradient(90deg,#f59e0b,#d97706)' :
                                        'linear-gradient(90deg,#f43f5e,#e11d48)';
                  const cat = categorizeKK(kk.kode_kk);
                  const target = cat === 'I' ? 'kklead-1.html' :
                                 cat === 'III' ? 'kklead-3.html' :
                                 'checklist.html';
                  const badgeColor = cat === 'I' ? 'bg-blue-100 text-blue-700' :
                                     cat === 'III' ? 'bg-emerald-100 text-emerald-700' :
                                     'bg-violet-100 text-violet-700';
                  return `
                    <tr>
                      <td>
                        <span class="inline-flex items-center gap-2">
                          <span class="w-8 h-8 rounded-lg ${badgeColor} flex items-center justify-center text-xs font-bold">
                            ${cat}
                          </span>
                          <span class="font-medium text-slate-700">KK ${kk.kode_kk}</span>
                        </span>
                      </td>
                      <td class="text-center font-medium">${kk.total}</td>
                      <td class="text-center text-xs text-slate-500">
                        ${kk.uploaded_items || 0}/${kk.total_items || 0}
                      </td>
                      <td class="text-center font-medium text-emerald-600">${kk.selesai}</td>
                      <td>
                        <div class="flex items-center gap-3 max-w-xs">
                          <div class="progress-bar flex-1">
                            <div style="width: ${kk.progress}%; background: ${progressColor}"></div>
                          </div>
                          <span class="text-xs font-semibold text-slate-600 w-10 text-right">${kk.progress}%</span>
                        </div>
                      </td>
                      <td class="text-center">
                        <a href="${target}?kk=${kk.kode_kk}&unit=${unit}&periode=${periode}"
                           class="btn btn-ghost text-xs text-blue-700">
                          Lihat →
                        </a>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      renderCharts(data, kkleadGroups);
    }

    // ============ CARD KKLEAD ============
    function renderKKLeadCard(key, group, unit, periode) {
      const colors = {
        I:   { bg: 'from-blue-500 to-blue-600',       text: 'text-blue-700',     btnHref: 'kklead-1.html' },
        II:  { bg: 'from-violet-500 to-violet-600',   text: 'text-violet-700',   btnHref: 'checklist.html' },
        III: { bg: 'from-emerald-500 to-emerald-600', text: 'text-emerald-700',  btnHref: 'kklead-3.html' }
      };
      const c = colors[key];
      const progressColor = group.progress >= 75 ? 'bg-emerald-500' :
                            group.progress >= 50 ? 'bg-amber-500' : 'bg-rose-500';
    
      // ✅ Status KK
      const totalKK = group.total_kk || 0;
      const selesaiKK = group.kk_selesai || 0;
      const allKKSelesai = totalKK > 0 && selesaiKK === totalKK;
    
      return `
        <div class="card p-5 animate-fade-in">
          <div class="flex items-start justify-between mb-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${c.bg} flex items-center justify-center text-white text-sm font-bold shadow-lg">
              ${key}
            </div>
            <div class="text-right">
              <div class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md
                          ${allKKSelesai
                            ? 'bg-emerald-100 text-emerald-700'
                            : 'bg-slate-100 text-slate-600'}">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <span class="text-xs font-bold">${selesaiKK}/${totalKK} KK</span>
              </div>
            </div>
          </div>
          <div class="font-bold text-slate-800 text-sm">${group.title}</div>
          <div class="text-xs text-slate-500 mb-3">${group.subtitle}</div>
    
          <div class="flex items-end justify-between mb-2">
            <div class="text-2xl font-bold ${c.text}">${group.progress}%</div>
            <div class="text-xs text-slate-500">${group.uploaded_items}/${group.total_items} item</div>
          </div>
    
          <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden mb-4">
            <div class="${progressColor} h-2 rounded-full transition-all duration-500" style="width: ${group.progress}%"></div>
          </div>
    
          <a href="${c.btnHref}?unit=${unit}&periode=${periode}"
             class="w-full text-xs font-medium text-slate-600 hover:text-white
                    bg-slate-50 hover:bg-gradient-to-r hover:${c.bg}
                    border border-slate-200 hover:border-transparent
                    py-2 rounded-lg inline-flex items-center justify-center gap-1
                    transition-all duration-200">
            Buka ${group.title}
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
      `;
    }

    // ============ CARD DISTRIBUSI GRADE (KKLEAD II) ============
    function renderGradeDistribution(dist) {
      const gradeInfo = {
        'A': { label: 'Grade A', color: 'bg-emerald-500', text: 'text-emerald-700', bg: 'bg-emerald-50', border: 'border-emerald-200' },
        'B': { label: 'Grade B', color: 'bg-blue-500',    text: 'text-blue-700',    bg: 'bg-blue-50',    border: 'border-blue-200' },
        'C': { label: 'Grade C', color: 'bg-amber-500',   text: 'text-amber-700',   bg: 'bg-amber-50',   border: 'border-amber-200' },
        'D': { label: 'Grade D', color: 'bg-orange-500',  text: 'text-orange-700',  bg: 'bg-orange-50',  border: 'border-orange-200' },
        'E': { label: 'Grade E', color: 'bg-rose-500',    text: 'text-rose-700',    bg: 'bg-rose-50',    border: 'border-rose-200' },
        'Belum Set': { label: 'Belum Ada Grade', color: 'bg-slate-400', text: 'text-slate-600', bg: 'bg-slate-50', border: 'border-slate-200' }
      };
    
      const order = ['E', 'D', 'C', 'B', 'A', 'Belum Set'];
      const totalParam = Object.values(dist).reduce((sum, g) => sum + (g.total_param || 0), 0);
      const totalSelesai = Object.values(dist).reduce((sum, g) => sum + (g.selesai_param || 0), 0);
    
      const cards = order.map(g => {
        const info = gradeInfo[g];
        const d = dist[g] || { total_param: 0, selesai_param: 0, total_items: 0, uploaded_items: 0, progress: 0 };
    
        return `
          <div class="rounded-xl border ${info.border} ${info.bg} p-4">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold ${info.text} uppercase tracking-wide">${info.label}</span>
              <span class="w-2 h-2 rounded-full ${info.color}"></span>
            </div>
            <div class="flex items-end gap-2 mb-1">
              <div class="text-2xl font-bold ${info.text}">${d.total_param}</div>
              <div class="text-xs text-slate-500 mb-1">parameter</div>
            </div>
            <div class="text-xs text-slate-500 mb-2">
              ${d.selesai_param} selesai · ${d.uploaded_items}/${d.total_items} item
            </div>
            <div class="w-full bg-white rounded-full h-1.5 overflow-hidden">
              <div class="${info.color} h-1.5 rounded-full" style="width: ${d.progress}%"></div>
            </div>
          </div>
        `;
      }).join('');
    
      return `
        <div class="card p-5 mb-6 animate-fade-in">
          <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
            <div>
              <h2 class="font-bold text-slate-800 flex items-center gap-2">
                <span class="w-6 h-6 rounded-lg bg-violet-100 text-violet-700 flex items-center justify-center text-xs font-bold">II</span>
                Distribusi Grade — KKLEAD II
              </h2>
              <p class="text-xs text-slate-500 mt-0.5">
                Parameter dikelompokkan berdasarkan <b>grade tertinggi</b> yang sudah di-mark selesai
              </p>
            </div>
            <div class="text-right">
              <div class="text-2xl font-bold text-violet-700">${totalSelesai}/${totalParam}</div>
              <div class="text-xs text-slate-500">parameter selesai</div>
            </div>
          </div>
    
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
            ${cards}
          </div>
    
          <div class="mt-4 text-xs text-slate-400 italic">
            💡 Parameter yang sudah di-mark selesai di grade E dan D, hanya dihitung sebagai grade D (tertinggi).
          </div>
        </div>
      `;
    }
    // ============ CHART ============
    function renderCharts(data, kkleadGroups) {
      if (chartStatus) chartStatus.destroy();
      if (chartKK) chartKK.destroy();

      // Doughnut Status
      chartStatus = new Chart(document.getElementById('chartStatus'), {
        type: 'doughnut',
        data: {
          labels: ['Selesai', 'Upload', 'Belum'],
          datasets: [{
            data: [
              data.status.Selesai || 0,
              data.status.Upload || 0,
              data.status.Belum || 0
            ],
            backgroundColor: ['#10b981', '#f59e0b', '#94a3b8'],
            borderWidth: 0,
            spacing: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 10, padding: 10, font: { size: 11 } }
            }
          }
        }
      });

      // Bar Chart per KK
      const allKKs = data.per_kk.map(k => k.kode_kk);
      const allProgress = data.per_kk.map(k => k.progress);

      chartKK = new Chart(document.getElementById('chartKK'), {
        type: 'bar',
        data: {
          labels: allKKs.map(k => 'KK ' + k),
          datasets: [{
            label: 'Progress (%)',
            data: allProgress,
            backgroundColor: allKKs.map(k => {
              const cat = categorizeKK(k);
              if (cat === 'I') return '#3b82f6';
              if (cat === 'III') return '#10b981';
              return '#8b5cf6';
            }),
            hoverBackgroundColor: '#1d4ed8',
            borderRadius: 8,
            barThickness: 24
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: {
              beginAtZero: true, max: 100,
              grid: { color: '#f1f5f9' },
              ticks: { color: '#94a3b8', font: { size: 11 } }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#64748b', font: { size: 10 } }
            }
          }
        }
      });
    }

    // ============ HELPERS ============
    function categorizeKK(kodeKK) {
      const kk = String(kodeKK || '').trim().toUpperCase();
      if (kk.startsWith('L')) return 'I';
      if (kk.startsWith('P')) return 'III';
      return 'II';
    }

    function statCard(label, value, sub, gradient, icon) {
      return `
        <div class="card p-5 animate-fade-in">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${gradient} flex items-center justify-center text-white text-lg shadow-lg mb-3">
            ${icon}
          </div>
          <div class="text-xs font-medium text-slate-500 uppercase tracking-wide">${label}</div>
          <div class="text-3xl font-bold text-slate-800 mt-1">${value}</div>
          <div class="text-xs text-slate-400 mt-1">${sub}</div>
        </div>
      `;
    }

    function statusChip(label, val, cls) {
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg ${cls} text-xs font-medium">
        <span class="w-1.5 h-1.5 rounded-full bg-current opacity-60"></span>
        ${label}: ${val}
      </span>`;
    }

    init();

    // ============ DOWNLOAD REKAP ============
    async function downloadRekap() {
      const periode = document.getElementById('filterPeriode').value;
      if (!currentUnit || !periode) {
        alert('Pilih unit dan periode dulu');
        return;
      }
    
      if (typeof showToast === 'function') {
        showToast('Menyiapkan file rekap...', 'info');
      }
    
      try {
        const data = await API.getRekap(currentUnit, periode);
        if (!data.rows || data.rows.length === 0) {
          if (typeof showToast === 'function') showToast('Tidak ada data untuk di-download', 'error');
          return;
        }
    
        const headers = [
          'Kode KK',
          'Sub Unsur',
          'No Param',
          'Uraian Parameter',
          'Status',
          'PIC',
          'Grade Tertinggi',
          'Grades Selesai',
          'Jumlah Eviden',
          'Terupload',
          'Progress',
          'Link Eviden',
          'Update Terakhir',
          'Update Oleh'
        ];
    
        const escCSV = (val) => {
          const s = String(val ?? '').replace(/"/g, '""');
          return `"${s}"`;
        };
    
        const lines = [headers.map(escCSV).join(';')];
    
        data.rows.forEach(r => {
          const row = [
            r.kode_kk,
            r.subunsur,
            r.no_parameter,
            r.uraian_parameter,
            r.status,
            r.pic,
            r.grade_tertinggi,
            r.grades_done,
            r.jumlah_eviden,
            r.jumlah_terupload,
            r.progress,
            r.link_eviden,
            r.updated_at,
            r.updated_by
          ];
          lines.push(row.map(escCSV).join(';'));
        });
    
        const csvContent = '\uFEFF' + lines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
    
        const link = document.createElement('a');
        link.href = url;
        link.download = `Rekap_SPIP_${data.unit}_${data.periode}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    
        if (typeof showToast === 'function') {
          showToast('File rekap berhasil di-download', 'success');
        }
      } catch (err) {
        console.error('Download error:', err);
        if (typeof showToast === 'function') {
          showToast('Gagal download: ' + err.message, 'error');
        } else {
          alert('Gagal download: ' + err.message);
        }
      }
    }
    
    window.downloadRekap = downloadRekap;
  </script>

</body>
</html>
